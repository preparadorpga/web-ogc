# Publica solo, sin el ordenador de Vicente, la cola de redes de Preparador OGC (sync/redes/manifiesto.json)
# en Instagram @preparadorogc y en la página de Facebook Preparador OGC. Copia adaptada de redes.yml de PGA.
# Secreto: META_ACCESS_TOKEN (usuario del sistema web-pga). Pausa: crear sync/redes/PAUSA.
# Horarios (UTC): 12:40, 17:05 y 19:10 → 13:40, 18:05 y 20:10 en Madrid (horario de invierno; la cola acaba el 13/03/2027).
# Un push que toque sync/redes/prueba/ lanza un diagnóstico (no publica nada) y deja el resultado en sync/redes/estado/.
name: Publicar redes OGC

on:
  schedule:
    - cron: "40 12 * * *"
    - cron: "5 17 * * *"   # 18:05 Madrid: felicitaciones de empresa (S01-S04) a las 18:00
    - cron: "10 19 * * *"
  push:
    branches: [main]
    paths: ["sync/redes/prueba/**"]
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar o diagnostico"
        default: publicar

concurrency:
  group: redes-ogc
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Publicar o diagnosticar
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          MODO: ${{ github.event_name == 'push' && 'diagnostico' || inputs.modo || 'publicar' }}
        run: |
          echo "::add-mask::$META_ACCESS_TOKEN"
          export MEDIA_SHA=$(git rev-parse HEAD)
          if [ "$MODO" = "diagnostico" ]; then node .github/scripts/publicar-redes.mjs --diagnostico; else node .github/scripts/publicar-redes.mjs; fi
      - name: Guardar el registro
        if: always()
        run: |
          git config user.name "agente-ogc"
          git config user.email "agente-ogc@users.noreply.github.com"
          git add sync/redes/estado || true
          git diff --cached --quiet && exit 0
          git commit -m "Redes OGC: registro de publicación automática"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
